name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    env:
      DB_DSN: ${{ secrets.DB_DSN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      
      - name: Install tern
        run: go install github.com/jackc/tern/v2@latest

      - name: Build app
        run: scripts/buildprod.sh

       # 1. GCP Authenticate
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 2. for gcloud CLI setup
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      # 3. for testing if gcloud is working
      - name: 'Use gcloud CLI'
        run: 'gcloud info'
      
      # 4. Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --tag asia-southeast1-docker.pkg.dev/stayz-booking-9311/stayz-ar-repo/stayz:latest .
      
      # 5. Run Database Migrations
      - name: Run Database Migrations
        run: scripts/migrateup.sh
        env:
          DB_DSN: ${{ secrets.DB_DSN }}

      # 6. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: gcloud run deploy stayz --image asia-southeast1-docker.pkg.dev/stayz-booking-9311/stayz-ar-repo/stayz:latest --region asia-south2 --allow-unauthenticated --project stayz-booking-9311 --max-instances=4
   